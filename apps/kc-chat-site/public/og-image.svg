<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KC Chat  unlimited Cursor IDE conversations">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(980 110) rotate(130) scale(560)">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="96" y1="300" x2="760" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(96 84)">
    <rect width="64" height="64" rx="16" fill="#6366F1"/>
    <path d="M16 24h8v4h-8v-4zm0 8h12v4H16v-4zm0 8h8v4h-8v-4z" fill="#fff" opacity=".6"/>
    <path d="M32 20h16v4H32v-4zm0 8h12v4H32v-4zm0 8h16v4H32v-4zm0 8h10v4H32v-4z" fill="#fff"/>
    <text x="84" y="44" font-family="Inter, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#fff">KC Chat</text>
  </g>

  <!-- headline -->
  <text x="96" y="296" font-family="Inter, 'Segoe UI', sans-serif" font-size="74" font-weight="800" fill="#F8FAFC" letter-spacing="-2">Keep coding when Cursor</text>
  <text x="96" y="382" font-family="Inter, 'Segoe UI', sans-serif" font-size="74" font-weight="800" letter-spacing="-2"><tspan fill="#F8FAFC">says </tspan><tspan fill="url(#accent)">&#8220;out of tokens&#8221;</tspan></text>

  <!-- subline -->
  <text x="98" y="452" font-family="Inter, 'Segoe UI', sans-serif" font-size="30" font-weight="500" fill="#94A3B8">Unlimited Cursor IDE conversations � pay once, use forever</text>

  <!-- cost pill -->
  <g transform="translate(96 506)">
    <rect width="430" height="62" rx="31" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="34" y="40" font-family="Inter, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#6EE7B7">Save $50$200 / month on tokens</text>
  </g>

  <!-- domain -->
  <text x="1104" y="568" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="500" fill="#64748B">h540.com</text>
</svg>
