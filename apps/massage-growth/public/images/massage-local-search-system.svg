<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">按摩店本地搜索转化流程图</title>
  <desc id="desc">展示搜索、Google 地图、访问网站到完成预约的按摩店本地增长流程。</desc>
  <defs>
    <style>
      .bg { fill: #f4f9fc; }
      .card { fill: #ffffff; stroke: #b7d0e2; stroke-width: 3; rx: 18; }
      .text { fill: #0b3a53; font: 600 28px Arial, sans-serif; }
      .sub { fill: #2f80ed; font: 500 18px Arial, sans-serif; }
      .arrow { stroke: #0b3a53; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0b3a53" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="360" rx="20" />

  <rect class="card" x="40" y="90" width="240" height="180" />
  <text class="text" x="160" y="170" text-anchor="middle">搜索</text>
  <text class="sub" x="160" y="205" text-anchor="middle">本地意图查询</text>

  <rect class="card" x="330" y="90" width="240" height="180" />
  <text class="text" x="450" y="170" text-anchor="middle">Google 地图</text>
  <text class="sub" x="450" y="205" text-anchor="middle">资料页与地图展示</text>

  <rect class="card" x="620" y="90" width="240" height="180" />
  <text class="text" x="740" y="170" text-anchor="middle">访问网站</text>
  <text class="sub" x="740" y="205" text-anchor="middle">查看服务页面</text>

  <rect class="card" x="910" y="90" width="240" height="180" />
  <text class="text" x="1030" y="170" text-anchor="middle">完成预约</text>
  <text class="sub" x="1030" y="205" text-anchor="middle">预约提交成功</text>

  <path class="arrow" d="M280 180 H320" />
  <path class="arrow" d="M570 180 H610" />
  <path class="arrow" d="M860 180 H900" />
</svg>
